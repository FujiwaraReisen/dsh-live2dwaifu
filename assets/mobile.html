<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12141a" />
<title>夏铃</title>
<style>
  :root { --bg:#12141a; --line:#2c313a; --txt:#dfe4ec; --dim:#7d858f; --acc:#6aa9ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    font:14px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; height:100dvh; }
  #stage { flex:1; border:0; width:100%; background:transparent; }
  #bar { flex:none; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:#15181e; }
  #bar input { flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid #333842;
    background:#1b1f27; color:var(--txt); font:inherit; outline:none; }
  #bar input:focus { border-color:#3f4a5c; }
  #bar button { flex:none; padding:0 16px; border-radius:12px; border:1px solid #3e6b9e;
    background:#27405f; color:#eaf2ff; font:inherit; cursor:pointer; }
  #bar button:active { filter:brightness(1.15); }
  #hint { flex:none; text-align:center; font-size:11px; color:var(--dim); padding:0 0 6px; background:#15181e; }
</style>
</head>
<body>
<div id="app">
  <iframe id="stage" src="/dsh-live2d/viewer?embed=1&bg=dark"></iframe>
  <div id="hint">说一句，她回你。不进聊天记录。</div>
  <div id="bar">
    <input id="text" placeholder="跟她说一句" autocomplete="off" enterkeyhint="send" />
    <button id="send">说</button>
  </div>
</div>
<script>
(function () {
  var frame = document.getElementById('stage');
  var box = document.getElementById('text');
  var btn = document.getElementById('send');
  var busy = false;

  function say(text, image, choices) {
    try {
      frame.contentWindow.postMessage({ type: 'dsh-live2d/say', text: text || '', image: image, choices: choices }, '*');
    } catch (e) {}
  }

  function send() {
    var t = box.value.trim();
    if (!t || busy) return;
    busy = true;
    box.value = '';
    fetch('/dsh-live2d/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: t })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.reply || d.image) say(d.reply, d.image, d.choices);
      })
      .catch(function () {})
      .finally(function () { busy = false; });
  }

  btn.addEventListener('click', send);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send();
  });

  // 主动开口也收着
  var seq = null;
  setInterval(function () {
    if (document.hidden) return;
    fetch('/dsh-live2d/api/poll?since=' + (seq === null ? 0 : seq))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (seq === null) { seq = d.seq || 0; return; }
        seq = d.seq || seq;
        (d.items || []).forEach(function (it) { say(it.text, it.image, it.choices); });
      })
      .catch(function () {});
  }, 3000);
})();
</script>
</body>
</html>
