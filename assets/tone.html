<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>音色 — dsh-live2dwaifu</title>
<style>
  :root { --bg:#12141a; --card:#171a20; --line:#2c313a; --txt:#dfe4ec; --dim:#7d858f; --acc:#6aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1100px 560px at 50% -10%, #1b1f27, var(--bg));
    color:var(--txt); font:13px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    display:flex; align-items:flex-start; justify-content:center; gap:26px; padding:26px; flex-wrap:wrap; }
  .left { display:flex; flex-direction:column; gap:10px; width:340px; }
  .card { width:340px; height:460px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .card iframe { display:block; width:100%; height:100%; border:0; background:transparent; }
  .panel { width:400px; }
  .panel h1 { font-size:15px; margin:0 0 3px; font-weight:600; }
  .panel p.sub { margin:0 0 14px; color:var(--dim); font-size:12px; }
  .group { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:#15181e; }
  .group h2 { font-size:11px; letter-spacing:.6px; color:var(--dim); margin:0 0 10px; font-weight:600; }
  select { width:100%; padding:8px 10px; border-radius:9px; border:1px solid #3c424c; background:#181c22;
    color:var(--txt); font:inherit; font-size:13px; }
  .presets { display:flex; gap:8px; }
  .presets button { flex:1; padding:9px 0; border-radius:9px; border:1px solid #3c424c; background:#232830;
    color:#cfd4dd; cursor:pointer; font:inherit; font-size:12px; }
  .presets button.on { border-color:var(--acc); background:#1e2c40; color:#eaf2ff; }
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12px; }
  .row span.lab { width:56px; flex:none; color:var(--dim); }
  .row input[type=range] { flex:1; accent-color:var(--acc); }
  .row b { width:46px; text-align:right; font-weight:500; color:#dfe4ec; font-variant-numeric:tabular-nums; }
  .typebox { display:flex; gap:8px; }
  .typebox input { flex:1; padding:9px 11px; border-radius:9px; border:1px solid #3c424c; background:#181c22;
    color:var(--txt); font:inherit; font-size:12px; }
  button.act { padding:9px 14px; border-radius:9px; border:1px solid #3c424c; background:#232830;
    color:#dfe4ec; cursor:pointer; font:inherit; font-size:12px; }
  button.act.primary { background:#27405f; border-color:#3e6b9e; color:#eaf2ff; }
  button.act:hover { filter:brightness(1.12); }
  .foot { display:flex; align-items:center; gap:10px; }
  .state { color:var(--dim); font-size:11px; margin-left:auto; }
  .tip { color:#6f7783; font-size:11px; margin-top:10px; line-height:1.7; }

  .sheet-close { position: fixed; right: 18px; top: 14px; z-index: 20;
    padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(30,36,45,.92); color: #dfe4ec; font: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(6px); }
  .sheet-close:hover { background: rgba(46,55,68,.96); }
</style>
</head>
<body>

<div class="left">
  <div class="card"><iframe id="live" src="/dsh-live2d/viewer?embed=1"></iframe></div>
  <div class="tip">没声音就先点她一下——浏览器要一次点击才允许出声。</div>
</div>

<div class="panel">
  <h1>音色</h1>
  <p class="sub">一个字一声短音。音量 0 就是安静，只留气泡和口型。</p>

  <div class="group">
    <h2>配给哪个模型</h2>
    <select id="models"></select>
  </div>

  <div class="group">
    <h2>音色</h2>
    <div class="presets" id="presets">
      <button data-p="soft" class="on">柔和</button>
      <button data-p="crisp">清脆</button>
      <button data-p="hard">机械</button>
      <button data-p="game">游戏</button>
    </div>
  </div>

  <div class="group">
    <h2>参数</h2>
    <div class="row"><span class="lab">基频</span><input id="base" type="range" min="80" max="1200" value="400" /><b id="baseV">400</b></div>
    <div class="row"><span class="lab">抖动</span><input id="jit" type="range" min="0" max="50" value="10" /><b id="jitV">10%</b></div>
    <div class="row"><span class="lab">长度</span><input id="dur" type="range" min="10" max="200" value="60" /><b id="durV">60</b></div>
    <div class="row"><span class="lab">音量</span><input id="vol" type="range" min="0" max="100" value="32" /><b id="volV">32</b></div>
    <div class="row"><span class="lab">语速</span><input id="spd" type="range" min="20" max="200" value="62" /><b id="spdV">62</b></div>
  </div>

  <div class="group">
    <h2>试一句</h2>
    <div class="typebox">
      <input id="text" value="窗台那盆，红了。" />
      <button class="act primary" id="say">说</button>
    </div>
  </div>

  <div class="foot">
    <button class="act primary" id="save">存到这只模型</button>
    <button class="act" id="reset">恢复默认</button>
    <span class="state" id="state"></span>
  </div>
  <div class="tip">每只模型各存一份。换模型、换人，声音跟着换。</div>
</div>

<script>
(function () {
  var DEFAULTS = { preset: 'soft', type: 'triangle', base: 400, jit: 10, dur: 60, vol: 32, spd: 62 };
  var PRESETS = {
    soft: { type: 'triangle', base: 400, jit: 10, dur: 60, vol: 32, spd: 62 },
    crisp: { type: 'square', base: 620, jit: 8, dur: 34, vol: 24, spd: 48 },
    hard: { type: 'sawtooth', base: 300, jit: 24, dur: 44, vol: 22, spd: 56 },
    game: { type: 'square', base: 520, jit: 18, dur: 28, vol: 26, spd: 44 }
  };

  var voice = Object.assign({}, DEFAULTS);
  var modelId = '';
  var frame = document.getElementById('live');
  var state = document.getElementById('state');
  var sel = document.getElementById('models');
  var presetBtns = [].slice.call(document.querySelectorAll('#presets button'));

  function $(id) { return document.getElementById(id); }

  function pushTone() {
    try {
      frame.contentWindow.postMessage({ type: 'dsh-live2d/tone', voice: voice }, '*');
    } catch (e) {}
  }

  function sayOnce(text) {
    pushTone();
    try {
      frame.contentWindow.postMessage({ type: 'dsh-live2d/say', text: text }, '*');
    } catch (e) {}
  }

  function show() {
    $('base').value = voice.base; $('baseV').textContent = voice.base;
    $('jit').value = voice.jit; $('jitV').textContent = voice.jit + '%';
    $('dur').value = voice.dur; $('durV').textContent = voice.dur;
    $('vol').value = voice.vol; $('volV').textContent = voice.vol;
    $('spd').value = voice.spd; $('spdV').textContent = voice.spd;
    presetBtns.forEach(function (b) {
      b.classList.toggle('on', b.dataset.p === voice.preset);
    });
  }

  function bind(id, key, fmt) {
    var el = $(id);
    var out = $(id + 'V');
    el.addEventListener('input', function () {
      voice[key] = Number(el.value);
      voice.preset = 'custom';
      out.textContent = fmt ? fmt(voice[key]) : voice[key];
      presetBtns.forEach(function (b) { b.classList.remove('on'); });
      pushTone();
    });
    el.addEventListener('change', function () {
      sayOnce('嗯。');
    });
    out.textContent = fmt ? fmt(voice[key]) : voice[key];
  }

  bind('base', 'base');
  bind('jit', 'jit', function (v) { return v + '%'; });
  bind('dur', 'dur');
  bind('vol', 'vol');
  bind('spd', 'spd');

  presetBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = PRESETS[b.dataset.p] || DEFAULTS;
      Object.keys(DEFAULTS).forEach(function (k) {
        if (k in p) voice[k] = p[k];
      });
      voice.preset = b.dataset.p;
      show();
      sayOnce('你回来了。锅里还有。');
    });
  });

  $('say').addEventListener('click', function () {
    sayOnce($('text').value || '嗯。');
  });
  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sayOnce($('text').value || '嗯。');
  });

  $('reset').addEventListener('click', function () {
    voice = Object.assign({}, DEFAULTS);
    show();
    pushTone();
    state.textContent = '已恢复默认，还没存';
  });

  $('save').addEventListener('click', function () {
    if (!modelId) return;
    state.textContent = '存…';
    fetch('/dsh-live2d/api/voice', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: modelId, voice: voice })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.textContent = d.ok ? '存好了' : '没存上：' + (d.error || '?');
      })
      .catch(function (e) { state.textContent = '没存上：' + e.message; });
  });

  sel.addEventListener('change', function () {
    modelId = sel.value;
    loadVoice(true);
  });

  function loadVoice(alsoSwitch) {
    if (!modelId) return;
    state.textContent = '读…';
    if (alsoSwitch) {
      fetch('/dsh-live2d/api/select', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: modelId })
      }).then(function () {
        frame.src = '/dsh-live2d/viewer?embed=1&t=' + Date.now();
      });
    }
    fetch('/dsh-live2d/api/voice?id=' + encodeURIComponent(modelId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        voice = Object.assign({}, DEFAULTS, d.voice || {});
        show();
        pushTone();
        setTimeout(pushTone, 900);
        state.textContent = '读好了';
      })
      .catch(function (e) { state.textContent = '读不了：' + e.message; });
  }

  fetch('/dsh-live2d/api/models')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = d.models || [];
      sel.innerHTML = '';
      list.forEach(function (m) {
        var o = document.createElement('option');
        o.value = m.id;
        o.textContent = (m.name || m.id) + (m.id === d.selected ? '（正在显示）' : '');
        sel.appendChild(o);
      });
      modelId = d.selected || (list[0] && list[0].id) || '';
      if (modelId) sel.value = modelId;
      if (!list.length) {
        state.textContent = '还没有模型';
        return;
      }
      loadVoice(false);
    })
      .catch(function (e) { state.textContent = '读不了模型表：' + e.message; });

  frame.addEventListener('load', function () {
    pushTone();
  });
})();
</script>
<button id="sheet-close" class="sheet-close">关掉</button>

<script>
(function () {
  var b = document.getElementById('sheet-close');
  if (b) b.onclick = function () {
    try { window.parent.postMessage({ type: 'dsh-live2d/close' }, '*'); } catch (e) {}
  };
})();
</script>
</body>
</html>
