<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Live2D</title>
<style>

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 12px/1.55 "Microsoft YaHei", system-ui, sans-serif; color: #dde2ea; }
  body.standalone { background: #14161a; }
  #stage { display: block; width: 100%; height: 100%; }
  #bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column;
    gap: 8px; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  #bubble { position: relative; min-height: 34px; box-sizing: border-box;
    padding: 9px 12px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(32,37,45,.96), rgba(22,25,31,.97));
    border: 1px solid rgba(255,255,255,.09); box-shadow: 0 10px 28px rgba(0,0,0,.5);
    backdrop-filter: blur(8px); color: #e8edf4; font-size: 13px; line-height: 1.6;
    opacity: 0; transition: opacity .35s ease; cursor: grab; user-select: none;
    max-height: 42%; overflow: hidden; touch-action: none; }
  #bubble:active { cursor: grabbing; }
  /* 图跟文字并排：图在左，文字右，文字不被顶下去 */
  #bubble.img-side { display: flex; align-items: flex-start; gap: 9px; }
  #bubble.img-above { display: flex; flex-direction: column; gap: 7px; }
  .bub-txt { flex: 1 1 auto; min-width: 0; }
  .bub-img { display: block; border-radius: 10px; object-fit: contain; flex: none; }
  #bubble.img-side .bub-img { max-width: 45%; max-height: 96px; }
  #bubble.img-above .bub-img { max-width: 70%; max-height: 88px; }
  /* 单独浮一张，不占气泡 */
  #sticker { position: absolute; left: 10px; top: 10px; max-width: 38%; max-height: 32%;
    opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #sticker .stk-img { display: block; max-width: 100%; max-height: 100%; border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,.45); object-fit: contain; }
  #hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #98a0ad; }
  #hint.show { display: flex; }
  #drawer { position: absolute; inset: 0; display: none; flex-direction: column; padding: 12px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(18,20,26,.97), rgba(14,16,20,.99)); backdrop-filter: blur(12px); }
  #drawer.show { display: flex; }
  #drawer h2 { font-size: 11px; letter-spacing: .8px; font-weight: 600; margin: 0 0 8px; color: #8b94a3; }
  #list { flex: 0 1 auto; max-height: 32%; overflow-y: auto; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 10px; transition: background .15s; }
  .row:hover { background: rgba(255,255,255,.04); }
  .row.cur { background: rgba(106,169,255,.14); border: 1px solid rgba(106,169,255,.3); }
  .row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button { background: rgba(255,255,255,.07); color: #cfd4dd; border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 3px 9px; cursor: pointer; font: inherit; transition: background .15s; }
  .row button:hover { background: rgba(255,255,255,.14); }
  #exps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #exps button { background: rgba(255,255,255,.07); color: #cfd4dd; border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; transition: all .15s; }
  #exps button:hover { background: rgba(255,255,255,.14); }
  #exps button.on { background: linear-gradient(180deg,#33587f,#27405f); border-color: #4c7bb0; color: #eaf2ff; }
  #exps .tipx { color: #6f7783; font-size: 11px; align-self: center; }
  #choices { display: none; flex-wrap: wrap; gap: 8px; }
  #choices.show { display: flex; }
  #choices button { background: linear-gradient(180deg, rgba(52,66,86,.97), rgba(36,48,64,.97));
    border: 1px solid rgba(106,169,255,.45); border-radius: 999px; color: #e6f0fb; font: inherit; font-size: 12px;
    padding: 6px 13px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: all .15s; }
  #choices button:hover { filter: brightness(1.15); }
  #choices button:active { transform: translateY(1px); }
  #settings { flex: 0 1 auto; overflow-y: auto; margin-bottom: 8px; }
  #settings h3 { font-size: 10px; letter-spacing: .8px; color: #6f7783; font-weight: 600; margin: 10px 0 5px; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 12px; color: #c3c9d3; cursor: pointer; }
  .opt input { accent-color: #6aa9ff; }
  .opt-col { padding: 4px 2px 2px; }
  .opt-col input[type=range] { width: 100%; accent-color: #6aa9ff; }
  .opt-lab { font-size: 12px; color: #e2e8f1; margin-top: 2px; }
  .opt-note { font-size: 10.5px; line-height: 1.65; color: #6f7783; margin-top: 5px; }
  .opt-btn { margin-top: 7px; padding: 6px 12px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 12px;
    background: rgba(255,255,255,.07); color: #dfe4ec; border: 1px solid rgba(255,255,255,.12); transition: background .15s; }
  .opt-btn:hover { background: rgba(255,255,255,.14); }
  .opt-btn:disabled { opacity: .55; cursor: default; }
  #actions { display: flex; gap: 8px; flex: none; }
  #actions button { flex: 1; padding: 9px; border-radius: 10px; cursor: pointer; font: inherit;
    background: rgba(255,255,255,.07); color: #dfe4ec; border: 1px solid rgba(255,255,255,.1); transition: background .15s; }
  #actions button:hover { background: rgba(255,255,255,.14); }
  #tip { color: #6f7783; font-size: 10.5px; margin: 8px 2px 0; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="sticker"></div>
<div id="bottom">
  <div id="choices"></div>
  <div id="bubble"></div>
</div>
<div id="hint"><div>还没有模型。<br />点下面的「导入模型」，选中你的 Live2D 文件夹（含 .model3.json 那一层）。</div></div>
<div id="drawer">
  <h2>模型</h2>
  <div id="list"></div>
  <div id="exps"></div>
  <div id="settings"></div>
  <div id="actions">
    <button id="import">导入模型</button>
    <button id="corpus">语料</button>
    <button id="close">关掉</button>
  </div>
  <div id="tip">选整个文件夹，浏览器会自己把里面所有文件读进来。</div>
  <input id="files" type="file" webkitdirectory multiple style="display:none" />
</div>
<script>
  if (!location.search.includes('embed')) document.body.classList.add('standalone');
</script>
<script src="/dsh-live2d/assets/live2dcubismcore.min.js"></script>
<script src="/dsh-live2d/assets/viewer.js"></script>
</body>
</html>
