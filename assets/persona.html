<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>人设卡 — dsh-live2dwaifu</title>
<style>
  :root { --bg:#12141a; --card:#171a20; --line:#2c313a; --txt:#dfe4ec; --dim:#7d858f; --acc:#6aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1100px 560px at 50% -10%, #1b1f27, var(--bg));
    color:var(--txt); font:13px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    display:flex; align-items:flex-start; justify-content:center; gap:26px; padding:26px; flex-wrap:wrap; }
  .left { display:flex; flex-direction:column; gap:10px; width:330px; }
  .card { width:330px; height:440px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .card iframe { display:block; width:100%; height:100%; border:0; }
  .panel { width:460px; }
  .panel h1 { font-size:15px; margin:0 0 3px; font-weight:600; }
  .panel p.sub { margin:0 0 14px; color:var(--dim); font-size:12px; }
  .group { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:#15181e; }
  .group h2 { font-size:11px; letter-spacing:.6px; color:var(--dim); margin:0 0 10px; font-weight:600; }
  select { width:100%; padding:8px 10px; border-radius:9px; border:1px solid #3c424c; background:#181c22;
    color:var(--txt); font:inherit; font-size:13px; }
  textarea { width:100%; height:300px; resize:vertical; padding:10px 12px; border-radius:10px;
    border:1px solid #3c424c; background:#181c22; color:var(--txt);
    font:12px/1.75 "Microsoft YaHei", system-ui, sans-serif; outline:none; }
  textarea:focus { border-color:#3f4a5c; }
  .switch { display:flex; align-items:flex-start; gap:10px; padding:4px 0; cursor:pointer; }
  .switch input { margin-top:3px; accent-color:var(--acc); }
  .switch b { font-weight:600; font-size:12.5px; }
  .switch em { display:block; font-style:normal; color:var(--dim); font-size:11.5px; line-height:1.6; }
  .foot { display:flex; align-items:center; gap:10px; }
  button.act { padding:9px 16px; border-radius:9px; border:1px solid #3c424c; background:#232830;
    color:#dfe4ec; cursor:pointer; font:inherit; font-size:12px; }
  button.act.primary { background:#27405f; border-color:#3e6b9e; color:#eaf2ff; }
  button.act:hover { filter:brightness(1.12); }
  .state { color:var(--dim); font-size:11px; margin-left:auto; }
  .tip { color:#6f7783; font-size:11px; margin-top:10px; line-height:1.7; }

  .sheet-close { position: fixed; right: 18px; top: 14px; z-index: 20;
    padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(30,36,45,.92); color: #dfe4ec; font: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(6px); }
  .sheet-close:hover { background: rgba(46,55,68,.96); }
</style>
</head>
<body>

<div class="left">
  <div class="card"><iframe id="live" src="/dsh-live2d/viewer?embed=1"></iframe></div>
  <div class="tip">左侧是当前模型预览。保存后，下一次回答就会按新的设定生成。</div>
</div>

<div class="panel">
  <h1>人设卡</h1>
  <p class="sub">角色的身份、性格、说话方式，都写在这里。</p>

  <div class="group">
    <h2>目标模型</h2>
    <select id="models"></select>
  </div>

  <div class="group">
    <h2>角色设定</h2>
    <textarea id="persona" spellcheck="false"></textarea>
  </div>

  <div class="group">
    <h2>世界隔离</h2>
    <label class="switch">
      <input type="checkbox" id="isolation" checked />
      <span>
        <b>角色视角隔离</b>
        <em>打开后，角色不会提到程序、界面、插件、模型这些词，按设定世界的视角回答。关闭后角色会承认自己是插件里的角色。</em>
      </span>
    </label>
  </div>

  <div class="foot">
    <button class="act primary" id="save">保存</button>
    <button class="act" id="reload">放弃修改</button>
    <span class="state" id="state"></span>
  </div>
  <div class="tip">保存在 <code>~/.dsh/dsh-live2d/models/&lt;id&gt;/meta.json</code> 的 <code>persona</code> 字段，也可以直接编辑该文件。</div>
</div>

<script>
(function () {
  var frame = document.getElementById('live');
  var sel = document.getElementById('models');
  var area = document.getElementById('persona');
  var iso = document.getElementById('isolation');
  var state = document.getElementById('state');
  var modelId = '';

  function $(id) { return document.getElementById(id); }

  function load() {
    if (!modelId) return;
    state.textContent = '读取中';
    fetch('/dsh-live2d/api/persona?id=' + encodeURIComponent(modelId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        area.value = d.persona || '';
        iso.checked = d.isolation !== false;
        state.textContent = d.custom ? '已自定义' : '使用默认设定';
      })
      .catch(function (e) { state.textContent = '读取失败：' + e.message; });
  }

  function save() {
    if (!modelId) return;
    state.textContent = '保存中';
    fetch('/dsh-live2d/api/persona', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: modelId, persona: area.value, isolation: iso.checked })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.textContent = d.ok ? '已保存' : '保存失败：' + (d.error || '未知错误');
        if (d.ok) {
          frame.src = '/dsh-live2d/viewer?embed=1&t=' + Date.now();
        }
      })
      .catch(function (e) { state.textContent = '保存失败：' + e.message; });
  }

  $('save').addEventListener('click', save);
  $('reload').addEventListener('click', load);
  sel.addEventListener('change', function () {
    modelId = sel.value;
    load();
  });

  fetch('/dsh-live2d/api/models')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = d.models || [];
      sel.innerHTML = '';
      list.forEach(function (m) {
        var o = document.createElement('option');
        o.value = m.id;
        o.textContent = (m.name || m.id) + (m.id === d.selected ? '（正在显示）' : '');
        sel.appendChild(o);
      });
      modelId = d.selected || (list[0] && list[0].id) || '';
      if (modelId) sel.value = modelId;
      if (!list.length) { state.textContent = '尚未导入模型'; return; }
      load();
    })
    .catch(function (e) { state.textContent = '读取模型列表失败：' + e.message; });
})();
</script>
<button id="sheet-close" class="sheet-close">关掉</button>

<script>
(function () {
  var b = document.getElementById('sheet-close');
  if (b) b.onclick = function () {
    try { window.parent.postMessage({ type: 'dsh-live2d/close' }, '*'); } catch (e) {}
  };
})();
</script>
</body>
</html>
