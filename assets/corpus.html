<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>语料 — dsh-live2dwaifu</title>
<style>
  :root { --bg:#12141a; --card:#15181e; --line:#2c313a; --txt:#dfe4ec; --dim:#7d858f; --acc:#6aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1100px 560px at 50% -10%, #1b1f27, var(--bg));
    color:var(--txt); font:13px/1.6 "Microsoft YaHei", system-ui, sans-serif; padding:22px 24px 28px; }
  h1 { font-size:15px; margin:0 0 4px; font-weight:600; }
  p.sub { margin:0 0 14px; color:var(--dim); font-size:12px; }
  .row { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  select, button { font:inherit; }
  select { padding:8px 10px; border-radius:9px; border:1px solid #3c424c; background:#181c22; color:var(--txt); font-size:13px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button.act { padding:8px 14px; border-radius:9px; border:1px solid #3c424c; background:#232830;
    color:#dfe4ec; cursor:pointer; font-size:12px; }
  button.act.primary { background:#27405f; border-color:#3e6b9e; color:#eaf2ff; }
  button.act:hover { filter:brightness(1.14); }
  .cols { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .col { flex:1 1 380px; min-width:320px; }
  .box { border:1px solid var(--line); border-radius:12px; background:var(--card); padding:12px; }
  .box h2 { font-size:11px; letter-spacing:.6px; color:var(--dim); margin:0 0 8px; font-weight:600; }
  textarea { width:100%; height:220px; resize:vertical; padding:10px 12px; border-radius:10px;
    border:1px solid #3c424c; background:#181c22; color:var(--txt);
    font:12.5px/1.75 "Microsoft YaHei", system-ui, sans-serif; outline:none; }
  textarea:focus { border-color:#3f4a5c; }
  #drop { margin-top:10px; border:1px dashed #3c424c; border-radius:10px; padding:14px; text-align:center;
    color:var(--dim); font-size:12px; cursor:pointer; transition:all .15s; }
  #drop.hot { border-color:var(--acc); color:#cfe2ff; background:rgba(106,169,255,.06); }
  .stat { font-size:12px; color:var(--dim); margin-bottom:6px; }
  .stat b { color:#e2e8f1; font-weight:600; }
  #preview { max-height:260px; overflow-y:auto; font-size:12px; line-height:1.75; }
  #preview div { padding:3px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  #preview .who { color:#6f7783; }
  .tips { color:#6f7783; font-size:11.5px; line-height:1.8; margin-top:10px; }
  code { background:rgba(255,255,255,.06); border-radius:4px; padding:1px 5px; font-size:11px; }
  .state { color:var(--dim); font-size:11.5px; margin-left:auto; }

  .sheet-close { position: fixed; right: 18px; top: 14px; z-index: 20;
    padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(30,36,45,.92); color: #dfe4ec; font: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(6px); }
  .sheet-close:hover { background: rgba(46,55,68,.96); }
</style>
</head>
<body>

<h1>语料</h1>
<p class="sub">把角色说过的话喂进来，之后说话就照这个调子。不用排版整齐，能读懂就行。</p>

<div class="row">
  <select id="models"></select>
  <div class="btns">
    <button class="act" id="pick">选文件</button>
    <button class="act primary" id="append">加进去</button>
    <button class="act" id="replace">替换成这些</button>
  </div>
  <span class="state" id="state"></span>
</div>

<div class="cols">
  <div class="col box">
    <h2>把话贴进来</h2>
    <textarea id="raw" spellcheck="false" placeholder="随便贴，几种写法都认：

他：今天吃啥
你：锅里还有，热的。

或者只贴角色的台词，一行一句：
锅里还有，热的。
先坐下。水在桌上。

也支持带引号的一句：「嗯。我也是。」"></textarea>
    <div id="drop">拖文件进来，或者点一下选（可以多选）<br /><span style="font-size:11px">文本、字幕、表格都认；图片和视频见下面</span></div>
    <input id="files" type="file" multiple accept=".txt,.json,.jsonl,.csv,.md,.srt,.vtt,.ass,image/*,video/*" style="display:none" />
    <div class="tips">
      认得的写法：<code>对方：… / 角色：…</code>、<code>「…」</code>、<code>- …</code>、一行一句、
      JSON 数组、字幕文件 <code>.srt / .vtt / .ass</code>（会自动去掉时间轴）。<br />
      说话人对得上才分得清是谁：他/我/用户/对方 算对方，你/她/角色/助手 算角色；认不出来的一律算角色说的。<br />
      图片和视频：暂时不进语料。图片可以留着当形象参考，视频建议先导出字幕文件，或者把台词复制进来。
    </div>
  </div>

  <div class="col box">
    <h2>解析出来长这样</h2>
    <div class="stat" id="stat">还没有内容</div>
    <div id="preview"></div>
    <div class="tips" id="saved"></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var modelId = '';
  var parsed = { lines: [], pairs: [] };
  var stored = { lines: [], pairs: [] };
  var files = [];

  var USERS = /^(他|我|用户|user|User|USER|问|Q)$/;
  var HERS = /^(你|她|它|助手|bot|Bot|BOT|答|A|B)$/;
  var SPEAK = /^\s*([^\s：:]{1,6})\s*[：:]\s*(.+)$/;

  function unquote(s) {
    var m = String(s).trim().match(/^[「“"'']([\s\S]+)[」”"'']$/);
    return m ? m[1].trim() : String(s).trim();
  }

  function parse(raw) {
    var lines = [], pairs = [];
    var pending = null;
    var rows = String(raw || '').split(/\r?\n/);
    for (var i = 0; i < rows.length; i += 1) {
      var line = rows[i].trim();
      if (!line) continue;

      if (line.charAt(0) === '{' || line.charAt(0) === '[') {
        try {
          var o = JSON.parse(line);
          var arr = Array.isArray(o) ? o : [o];
          var used = false;
          for (var k = 0; k < arr.length; k += 1) {
            var it = arr[k] || {};
            var a = it.assistant || it.a || it.answer || it.reply || it.response || it.text || '';
            var u = it.user || it.q || it.question || it.prompt || it.input || '';
            if (a) {
              if (u) pairs.push({ user: String(u), assistant: String(a) });
              else lines.push(String(a));
              used = true;
            }
          }
          if (used) continue;
        } catch (e) { /* 不是 JSON，按普通行处理 */ }
      }

      // 字幕文件：跳过序号、时间轴、文件头
      if (/^\d+$/.test(line)) continue;
      if (/-->/.test(line)) continue;
      if (/^(WEBVTT|NOTE|STYLE|REGION)/i.test(line)) continue;
      line = line.replace(/^[-*•·]\s*/, '');
      line = line.replace(/<[^>]+>/g, '');
      var m = line.match(SPEAK);
      if (m) {
        var who = m[1].trim();
        var said = unquote(m[2]);
        if (!said) continue;
        if (USERS.test(who)) { pending = said; continue; }
        if (HERS.test(who) || true) {
          pairs.push({ user: pending || '', assistant: said });
          pending = null;
          continue;
        }
      }
      var t = unquote(line);
      if (t) lines.push(t);
    }
    return { lines: lines, pairs: pairs };
  }

  function render() {
    var total = parsed.lines.length + parsed.pairs.length;
    $('stat').innerHTML = total
      ? '读到 <b>' + parsed.pairs.length + '</b> 组问答、<b>' + parsed.lines.length + '</b> 句台词'
      : '还没有内容';
    var box = $('preview');
    box.innerHTML = '';
    var show = [];
    for (var i = 0; i < parsed.pairs.length && show.length < 8; i += 1) {
      show.push('他：' + parsed.pairs[i].user + '<br>你：' + parsed.pairs[i].assistant);
    }
    for (var j = 0; j < parsed.lines.length && show.length < 14; j += 1) {
      show.push('你：' + parsed.lines[j]);
    }
    show.forEach(function (html) {
      var d = document.createElement('div');
      d.innerHTML = html.replace(/</g, '&lt;').replace(/&lt;br&gt;/g, '<br>');
      box.appendChild(d);
    });
    var kept = stored.lines.length + stored.pairs.length;
    $('saved').textContent = kept ? '已经存着 ' + kept + ' 条（' + stored.pairs.length + ' 组问答、' + stored.lines.length + ' 句台词）' : '';
  }

  function reparse() {
    var all = $('raw').value;
    for (var i = 0; i < files.length; i += 1) all += '\n' + files[i];
    parsed = parse(all);
    render();
  }

  function load() {
    if (!modelId) return;
    $('state').textContent = '读…';
    fetch('/dsh-live2d/api/corpus?id=' + encodeURIComponent(modelId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        stored = { lines: d.lines || [], pairs: d.pairs || [] };
        $('state').textContent = '读好了';
        render();
      })
      .catch(function (e) { $('state').textContent = '读不了：' + e.message; });
  }

  function save(mode) {
    if (!modelId) return;
    var payload;
    if (mode === 'replace') {
      payload = parsed;
    } else {
      payload = {
        lines: stored.lines.concat(parsed.lines),
        pairs: stored.pairs.concat(parsed.pairs)
      };
    }
    if (!payload.lines.length && !payload.pairs.length) {
      $('state').textContent = '没有可存的内容';
      return;
    }
    $('state').textContent = '存…';
    fetch('/dsh-live2d/api/corpus', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: modelId, lines: payload.lines, pairs: payload.pairs })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { $('state').textContent = '没存上：' + (d.error || '?'); return; }
        $('state').textContent = '存好了，共 ' + d.total + ' 条';
        $('raw').value = '';
        files = [];
        load();
      })
      .catch(function (e) { $('state').textContent = '没存上：' + e.message; });
  }

  $('raw').addEventListener('input', reparse);
  $('pick').addEventListener('click', function () { $('files').click(); });
  $('drop').addEventListener('click', function () { $('files').click(); });
  $('append').addEventListener('click', function () { save('append'); });
  $('replace').addEventListener('click', function () { save('replace'); });

  $('files').addEventListener('change', function (e) {
    var list = Array.prototype.slice.call(e.target.files || []);
    readFiles(list);
  });

  function readFiles(list) {
    if (!list.length) return;
    var texts = [];
    var skipped = [];
    list.forEach(function (f) {
      var name = String(f.name || '').toLowerCase();
      if (f.type.indexOf('image/') === 0 || /\.(png|jpe?g|webp|gif|bmp)$/.test(name)) {
        skipped.push(f.name + '（图片）');
        return;
      }
      if (f.type.indexOf('video/') === 0 || /\.(mp4|mkv|mov|avi|webm|flv)$/.test(name)) {
        skipped.push(f.name + '（视频）');
        return;
      }
      texts.push(f);
    });
    if (skipped.length) {
      $('saved').textContent = '这些没读：' + skipped.join('、') + ' —— 图片先留着当形象参考，视频请导出字幕(.srt)或直接贴台词。';
    }
    if (!texts.length) { $('state').textContent = '没有可读的文本'; return; }
    $('state').textContent = '读文件…';
    var left = texts.length;
    texts.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        files.push(String(reader.result || ''));
        left -= 1;
        if (left === 0) { $('state').textContent = '读好了 ' + texts.length + ' 个文件'; reparse(); }
      };
      reader.onerror = function () { left -= 1; if (left === 0) reparse(); };
      reader.readAsText(f, 'utf-8');
    });
  }

  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('hot'); });
  });
  drop.addEventListener('drop', function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files.length) readFiles(Array.prototype.slice.call(dt.files));
  });

  fetch('/dsh-live2d/api/models')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var list = d.models || [];
      var sel = $('models');
      sel.innerHTML = '';
      list.forEach(function (m) {
        var o = document.createElement('option');
        o.value = m.id;
        o.textContent = (m.name || m.id) + (m.id === d.selected ? '（正在显示）' : '');
        sel.appendChild(o);
      });
      modelId = d.selected || (list[0] && list[0].id) || '';
      if (modelId) sel.value = modelId;
      if (!list.length) { $('state').textContent = '还没有模型'; return; }
      load();
    })
    .catch(function (e) { $('state').textContent = '读不了模型表：' + e.message; });

  $('models').addEventListener('change', function (e) {
    modelId = e.target.value;
    load();
  });
})();
</script>
<button id="sheet-close" class="sheet-close">关掉</button>

<script>
(function () {
  var b = document.getElementById('sheet-close');
  if (b) b.onclick = function () {
    try { window.parent.postMessage({ type: 'dsh-live2d/close' }, '*'); } catch (e) {}
  };
})();
</script>
</body>
</html>
